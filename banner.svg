<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffd58a"/>
      <stop offset="55%" stop-color="#ff9d5c"/>
      <stop offset="100%" stop-color="#b5482f"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .twinkle{animation:tw 2.6s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .drift{animation:dr 8s ease-in-out infinite}
    @keyframes dr{0%{transform:translateY(0)}50%{transform:translateY(-14px)}100%{transform:translateY(0)}}
    .shoot{animation:sh 5s linear infinite}
    @keyframes sh{0%{transform:translate(0,0);opacity:0}4%{opacity:1}22%{transform:translate(320px,140px);opacity:0}100%{opacity:0}}
    .shoot2{animation:sh2 7s linear infinite}
    @keyframes sh2{0%{transform:translate(0,0);opacity:0}3%{opacity:1}18%{transform:translate(260px,110px);opacity:0}100%{opacity:0}}
  </style>

  <rect width="1200" height="300" fill="url(#skyGrad)"/>

  <circle class="drift" cx="980" cy="90" r="230" fill="url(#nebula1)"/>
  <circle class="drift" cx="250" cy="200" r="200" fill="url(#nebula2)" style="animation-delay:-3s"/>

  <circle class="drift" cx="990" cy="85" r="95" fill="#ff9d5c" opacity="0.08"/>
  <circle class="drift" cx="990" cy="85" r="68" fill="#ff9d5c" opacity="0.12"/>
  <circle class="drift" cx="990" cy="85" r="46" fill="url(#planetGrad)"/>
  <ellipse cx="990" cy="85" rx="78" ry="14" fill="none" stroke="#ffd58a" stroke-width="2" opacity="0.5"/>

  <circle class="twinkle" cx="80" cy="40" r="1.8" fill="#ffffff"/>
  <circle class="twinkle" cx="150" cy="120" r="1.4" fill="#ffffff" style="animation-delay:.4s"/>
  <circle class="twinkle" cx="240" cy="60" r="1.7" fill="#ffffff" style="animation-delay:.9s"/>
  <circle class="twinkle" cx="330" cy="160" r="1.4" fill="#ffffff" style="animation-delay:1.3s"/>
  <circle class="twinkle" cx="420" cy="45" r="1.6" fill="#ffffff" style="animation-delay:.2s"/>
  <circle class="twinkle" cx="500" cy="200" r="1.3" fill="#ffffff" style="animation-delay:1.6s"/>
  <circle class="twinkle" cx="580" cy="90" r="1.6" fill="#ffffff" style="animation-delay:.6s"/>
  <circle class="twinkle" cx="650" cy="230" r="1.3" fill="#ffffff" style="animation-delay:1s"/>
  <circle class="twinkle" cx="720" cy="50" r="1.7" fill="#ffffff" style="animation-delay:.3s"/>
  <circle class="twinkle" cx="800" cy="190" r="1.4" fill="#ffffff" style="animation-delay:1.8s"/>
  <circle class="twinkle" cx="860" cy="230" r="1.3" fill="#ffffff" style="animation-delay:.7s"/>
  <circle class="twinkle" cx="1120" cy="60" r="1.6" fill="#ffffff" style="animation-delay:1.4s"/>
  <circle class="twinkle" cx="1150" cy="200" r="1.3" fill="#ffffff" style="animation-delay:.5s"/>
  <circle class="twinkle" cx="1060" cy="230" r="1.5" fill="#ffffff" style="animation-delay:1.1s"/>
  <circle class="twinkle" cx="40" cy="200" r="1.4" fill="#ffffff" style="animation-delay:.8s"/>
  <circle class="twinkle" cx="380" cy="250" r="1.2" fill="#ffffff" style="animation-delay:1.5s"/>
  <circle class="twinkle" cx="700" cy="260" r="1.3" fill="#ffffff" style="animation-delay:.1s"/>
  <circle class="twinkle" cx="950" cy="240" r="1.2" fill="#ffffff" style="animation-delay:1.9s"/>

  <g class="shoot">
    <line x1="120" y1="60" x2="180" y2="90" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g class="shoot2">
    <line x1="600" y1="40" x2="650" y2="65" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <g transform="translate(90,190)">
    <path d="M0 60 L20 -40 L40 60 Z" fill="#c9d3e0"/>
    <circle cx="20" cy="15" r="9" fill="#5a6b8c"/>
    <path d="M0 60 L-18 88 L6 70 Z" fill="#ff7e5c"/>
    <path d="M40 60 L58 88 L34 70 Z" fill="#ff7e5c"/>
  </g>
</svg>
