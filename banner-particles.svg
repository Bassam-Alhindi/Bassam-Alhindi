<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="amb1" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#7c3aed" stop-opacity="0.16"/>
<stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
</radialGradient>
<radialGradient id="amb2" cx="50%" cy="50%" r="50%">
